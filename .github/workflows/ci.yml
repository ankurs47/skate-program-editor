name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Only so the summary below can be posted on the pull request.
  pull-requests: write
  # Only to fetch main's reports from its last green run, which is what the
  # summary compares this pull request against.
  actions: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # The same hooks a commit runs locally, so a contributor without the
      # framework installed still cannot land trailing whitespace, a shell
      # bug or a typo. It reruns lint and the unit suite as two of its hooks;
      # the steps below stay because they carry --net and write the report.
      - name: Pre-commit hooks
        id: hooks
        uses: pre-commit/action@v3.0.1
        env:
          # The unit suite runs again below, with --net for the encoder's
          # published versions and --report for the summary this workflow
          # posts. Running it here too would be the same checks twice for no
          # extra answer.
          SKIP: unit-tests

      # --net also asks npm whether the versions the vendored MP3 encoder was
      # built from are still the bytes that were published.
      - name: Test
        run: npm run test:net -- --report report/unit.json

      # The encoder in src/vendor is generated and committed, which is only
      # worth anything if the committed bytes are what its sources build. This
      # rebuilds it from the pinned versions and fails if they differ — the one
      # step here that installs anything, which is why it is its own step and
      # not part of the suite.
      - name: Vendored encoder matches its sources
        id: encoder
        run: npm run check:encoder

      # The browser checks drive real Chrome over the DevTools Protocol, which
      # is why they are not part of `npm test` — that has to keep working on a
      # machine with no browser and no network.
      #
      # ubuntu-latest is Ubuntu 24.04, whose image ships Google Chrome on PATH,
      # so nothing has to be installed here. If a future image ever drops it,
      # this step fails with a message naming what it looked for rather than
      # skipping quietly; set CHROME to a binary to override the search.
      - name: Browser checks
        run: npm run test:dom -- --report report/browser.json

      # main's own reports, kept from its last green run so a pull request can
      # be compared against what it is asking to change rather than against a
      # number frozen in a test file years ago. Best effort on purpose: there is
      # nothing to fetch before the first main run after this lands, artifacts
      # expire, and a fork's token cannot read them. The summary says so when it
      # comes back empty instead of printing a one-sided table.
      - name: Fetch main's reports to compare against
        if: >
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run=$(gh run list --workflow=ci.yml --branch=main --status=success \
                  --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "No green run on main to compare against yet."
            exit 0
          fi
          gh run download "$run" --name reports --dir main-reports ||
            echo "Run $run kept no reports; comparing against nothing."

      # Kept only from main, and only as the next pull request's baseline. It is
      # never read back into main's own run, so a bad number cannot become the
      # standard by being uploaded — the download above asks for a *green* run.
      - name: Keep these reports as main's baseline
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reports
          path: report/
          retention-days: 90
          if-no-files-found: warn

      # Posted whatever happened above, because a run that failed is exactly
      # when the summary is worth reading. One comment, edited in place, so a
      # branch with ten pushes does not end up with ten of these.
      #
      # Skipped for pull requests from forks: those get a read-only token, and
      # the alternative — pull_request_target — would run this workflow with
      # write access against code from the fork, which is not a trade worth
      # making for a comment.
      - name: Summarize on the pull request
        if: >
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The two step outcomes are passed in because neither writes a report
          # to read: they are steps that either passed or did not, and the
          # comment had never mentioned either of them.
          node test/summary.js report/unit.json report/browser.json \
            --encoder '${{ steps.encoder.outcome }}' \
            --hooks '${{ steps.hooks.outcome }}' \
            ${{ hashFiles('main-reports/*.json') != '' && '--baseline main-reports' || '' }} \
            > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file comment.md --edit-last --create-if-none
