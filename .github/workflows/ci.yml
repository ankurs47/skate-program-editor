name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # --net also re-checks that the pinned MP3 encoder hash still matches
      # what the CDN serves. If that ever fails, the CDN changed under us.
      - name: Test
        run: npm run test:net

      # The browser checks drive real Chrome over the DevTools Protocol, which
      # is why they are not part of `npm test` — that has to keep working on a
      # machine with no browser and no network.
      #
      # ubuntu-latest is Ubuntu 24.04, whose image ships Google Chrome on PATH,
      # so nothing has to be installed here. If a future image ever drops it,
      # this step fails with a message naming what it looked for rather than
      # skipping quietly; set CHROME to a binary to override the search.
      - name: Browser checks
        run: npm run test:dom
