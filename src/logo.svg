<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Skate Program Editor</title>
  <!--
    A pair of beamed quavers with a lightning split down the middle, the colours
    inverted either side of it. The music is whole; what changes is which side
    of the cut you are on.

    The notes are spaced so the bolt has a clean corridor. That is the whole
    reason the heads sit as far apart as they do: at closer spacing the bolt
    clipped the beam, both stems and a head on its way down, and a line that
    nicks five things reads as damage rather than as a cut. Now it crosses the
    beam once — deliberately — and falls through open space between the heads.
    Move a head inward or fatten a stem and that corridor closes.

    Three more things carry it:

    The bolt is uneven. A regular zigzag reads as a saw blade; uneven segments
    read as a crack in ice.

    Nothing is displaced. An earlier version slid the two halves apart along the
    cut, which worked, but once colour does the telling nothing needs to move —
    and standing still keeps the notes legible at 16px.

    The beam is slanted. Flat, it squares off with the two stems into a box and
    the mark reads as a rectangle rather than as music.

    The tile carries a 2px edge in the accent colour. Without it the white half
    dissolves into GitHub's white page and the mark loses a quarter of itself —
    which only showed up when it was rendered against the background it actually
    ships on, rather than the dark one it was drawn on.

    Every proportion was settled at 16px, the favicon size, which is where a
    mark either survives or turns to mush.

    Earlier attempts, so they are not repeated: a solid blade with a waveform
    notched out read as a boat with sails; a note mounted on a blade with sole
    plate, posts and toe picks was accurate and far too literal.

    Fixed colours rather than theme tokens: this is served as a favicon and
    rendered on GitHub's light and dark backgrounds, none of which load a
    stylesheet. The tile is what lets one file do all three.
  -->
  <defs>
    <!-- the bolt, closed off left and right to make the two sides -->
    <clipPath id="spe-left">
      <path d="M33 -10 L28 18 L34 24 L29 74 L-14 74 L-14 -10 Z"/>
    </clipPath>
    <clipPath id="spe-right">
      <path d="M33 -10 L28 18 L34 24 L29 74 L78 74 L78 -10 Z"/>
    </clipPath>
    <g id="spe-heads">
      <ellipse cx="17" cy="45" rx="7.6" ry="6" transform="rotate(-20 17 45)"/>
      <ellipse cx="43" cy="45" rx="7.6" ry="6" transform="rotate(-20 43 45)"/>
    </g>
    <g id="spe-stems" fill="none" stroke-linecap="round">
      <path stroke-width="4.2" d="M23.5 42.6 V19.4 M49.5 42.6 V15"/>
      <path stroke-width="5.6" d="M23.5 19.4 L49.5 15"/>
    </g>
  </defs>

  <g clip-path="url(#spe-left)">
    <rect width="64" height="64" rx="14" fill="#2f6df6"/>
    <use href="#spe-heads" fill="#fff"/>
    <use href="#spe-stems" stroke="#fff"/>
  </g>
  <g clip-path="url(#spe-right)">
    <rect width="64" height="64" rx="14" fill="#fff"/>
    <use href="#spe-heads" fill="#2f6df6"/>
    <use href="#spe-stems" stroke="#2f6df6"/>
  </g>

  <!-- keeps the white half from dissolving into a white page -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#2f6df6" stroke-width="2"/>
</svg>
